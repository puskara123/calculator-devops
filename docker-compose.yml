services:
  calculator:
    image: ${DOCKER_IMAGE:-DOCKERHUB_USER/calculator-devops}:${IMAGE_TAG:-latest}
    container_name: calculator-api
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    ports:
      - "8081:8080"
    networks:
      - calc-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 25s

  proxy:
    image: nginx:alpine
    container_name: calculator-proxy
    ports:
      - "8085:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
    networks:
      - calc-net
    restart: unless-stopped

networks:
  calc-net:
    driver: bridge